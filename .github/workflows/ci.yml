name: Bacalah KMP CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 3.5 Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: 4. Run Unit Tests & Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :core:jvmTest :app:shared:jvmTest :core:testAndroidHostTest :app:shared:testAndroidHostTest :app:androidApp:lintDevDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2048m

      - name: 5. Build Android APK & Web Distribution
        run: |
          chmod +x gradlew
          ./gradlew :app:androidApp:assembleDevDebug :app:webApp:jsBrowserDevelopmentExecutableDistribution --no-daemon -Dorg.gradle.jvmargs=-Xmx2048m

      - name: 6. Send APK & Notification to Telegram Group
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK_PATH="app/androidApp/build/outputs/apk/dev/debug/androidApp-dev-debug.apk"
          
          CAPTION=$(cat <<EOF
          📦 *NEW BUILD AVAILABLE!*

          📱 *App*: Bacalah Al-Quran
          🔢 *Build*: #${{ github.run_number }}
          🌿 *Branch*: ${{ github.ref_name }}
          🟢 *Status*: SUCCESS
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${APK_PATH}" \
            -F caption="${CAPTION}" \
            -F parse_mode="Markdown"

      - name: 7. Send Failure Notification
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE=$(cat <<EOF
          🔴 *BUILD FAILED!*

          📱 *App*: Bacalah Al-Quran
          🔢 *Build*: #${{ github.run_number }}
          🌿 *Branch*: ${{ github.ref_name }}
          ❌ *Status*: Execution Error
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
